services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - BACKEND_CORS_ORIGINS=["http://localhost:5173"]
    volumes:
      - ./backend/src:/app/src
    develop:
      watch:
        - action: rebuild
          path: ./backend/uv.lock

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend/package-lock.json
