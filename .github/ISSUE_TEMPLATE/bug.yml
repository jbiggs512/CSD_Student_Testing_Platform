name: Bug Report
description: Report a defect or unexpected behaviour
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly describe the problem.
      placeholder: Describe what is going wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps required to reproduce the issue.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should have happened?
      placeholder: The system should...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What happened instead?
      placeholder: The system instead...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: Identify the version or commit where the issue occurred.
      placeholder: e.g. v1.2.0 or a1b2c3d

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, error messages, logs, or other relevant evidence.
    validations:
      required: false