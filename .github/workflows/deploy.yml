name: Deploy

# Continuous Deployment pipeline:
#   - Push to `development` -> builds & pushes images to GHCR -> deploys both containers to the Azure Dev Web App
#   - Push to `master`      -> builds & pushes images to GHCR -> deploys both containers to the Azure Prod Web App
on:
  push:
    branches: ["master", "development"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    outputs:
      image_base: ${{ steps.base.outputs.name }}
      image_tag: ${{ steps.base.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base and tag
        id: base
        run: |
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.base.outputs.name }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-development:
    name: Deploy to development
    needs: publish
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write # OIDC login to Azure
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure database connection
        if: ${{ secrets.DATABASE_URL != '' }}
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "DATABASE_URL",
                "value": "${{ secrets.DATABASE_URL }}",
                "slotSetting": false
              }
            ]

      - name: Generate multi-container compose config
        run: |
          cat << 'EOF' > docker-compose.azure.yml
          version: "3.8"
          services:
            backend:
              image: ${{ needs.publish.outputs.image_base }}-backend:${{ needs.publish.outputs.image_tag }}
              expose:
                - "8000"
              environment:
                - DATABASE_URL=${DATABASE_URL}
                - SECRET_KEY=${SECRET_KEY}
                - COOKIE_SECURE=${COOKIE_SECURE}
              restart: always

            frontend:
              image: ${{ needs.publish.outputs.image_base }}-frontend:${{ needs.publish.outputs.image_tag }}
              ports:
                - "80:5173"
              environment:
                - VITE_API_URL=/api/v1
                - BACKEND_PROXY_TARGET=http://backend:8000
              depends_on:
                - backend
              restart: always
          EOF

      - name: Deploy multi-container Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          multi-container-config-type: compose
          multi-container-config-file: docker-compose.azure.yml
          images: |
            ${{ needs.publish.outputs.image_base }}-backend:${{ needs.publish.outputs.image_tag }}
            ${{ needs.publish.outputs.image_base }}-frontend:${{ needs.publish.outputs.image_tag }}

  deploy-production:
    name: Deploy to production
    needs: publish
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write # OIDC login to Azure
      contents: read
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure database connection
        if: ${{ secrets.DATABASE_URL != '' }}
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          app-settings-json: |
            [
              {
                "name": "DATABASE_URL",
                "value": "${{ secrets.DATABASE_URL }}",
                "slotSetting": false
              }
            ]

      - name: Generate multi-container compose config
        run: |
          cat << 'EOF' > docker-compose.azure.yml
          version: "3.8"
          services:
            backend:
              image: ${{ needs.publish.outputs.image_base }}-backend:${{ needs.publish.outputs.image_tag }}
              expose:
                - "8000"
              environment:
                - DATABASE_URL=${DATABASE_URL}
                - SECRET_KEY=${SECRET_KEY}
                - COOKIE_SECURE=${COOKIE_SECURE}
              restart: always

            frontend:
              image: ${{ needs.publish.outputs.image_base }}-frontend:${{ needs.publish.outputs.image_tag }}
              ports:
                - "80:5173"
              environment:
                - VITE_API_URL=/api/v1
                - BACKEND_PROXY_TARGET=http://backend:8000
              depends_on:
                - backend
              restart: always
          EOF

      - name: Deploy multi-container Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          multi-container-config-type: compose
          multi-container-config-file: docker-compose.azure.yml
          images: |
            ${{ needs.publish.outputs.image_base }}-backend:${{ needs.publish.outputs.image_tag }}
            ${{ needs.publish.outputs.image_base }}-frontend:${{ needs.publish.outputs.image_tag }}
