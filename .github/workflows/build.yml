name: Build
on:
  push:
    branches: ["master", "development"]
  pull_request:
    branches: ["master", "development"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  sonarqube:
    name: SonarQube
    needs: build # Added so it waits for the build job to finish testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: backend/

      - name: Download Frontend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    # PostgreSQL service for backend testing
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altius
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Environment variables available to all steps in this job
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/altius

    steps:
      - uses: actions/checkout@v7

      # Install uv to manage Python dependencies
      - name: Install uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf

      # Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync --locked # NOSONAR
        # Sonar does not recongise that uv locks files. This is a safe bypass.

      # Run backend tests
      - name: Run Pytest & Generate Coverage
        working-directory: ./backend
        run: uv run pytest # NOSONAR
        # Sonar does not recongise that uv locks files. This is a safe bypass.

      # Upload backend coverage XML so the SonarQube job can read it
      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          include-hidden-files: true

      # Setup Node.js for the frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      # Lint frontend
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      # Build frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Test frontend
      - name: Test frontend & Generate Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      # Upload frontend coverage
      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/lcov.info
          include-hidden-files: true
