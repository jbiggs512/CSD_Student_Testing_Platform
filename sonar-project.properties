sonar.projectKey=jbiggs512_CSD_Student_Testing_Platform
sonar.organization=jbiggs512


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=CSD_Student_Testing_Platform
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Tell Sonar where to find the Python and JavaScript/TypeScript test coverage reports
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Tell Sonar not to expect test coverage ON your actual test files or barrel/entry files
sonar.coverage.exclusions=backend/tests/**,frontend/tests/**,frontend/src/main.tsx,frontend/src/**/index.ts,frontend/vite.config.ts,**/*.example,backend/src/app/**/__init__.py
